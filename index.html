<p style="text-align:left"><b>♪ EFFETTI SONORI</b><br>Effetti retro a 8-bit per colpi, PERFECT, boost, scudi, carte, mutazioni, medaglie e Game Over. Si possono disattivare in <b>⚙ IMPOSTAZIONI</b>, dal menu o durante una partita. L'opzione viene salvata nel browser. La musica non è ancora disponibile.</p>

<p style="text-align:left"><b>⚙ IMPOSTAZIONI DURANTE LA RUN</b><br>In <b>Arcade</b> e <b>Roguelite</b>, premi l'icona <b>⚙</b> in alto per mettere in pausa. Scegli <b>RIPRENDI PARTITA</b> oppure <b>TORNA AL MENU</b>. Prima di uscire viene chiesta conferma <b>SÌ / NO</b>. Uscendo perdi i progressi della run; in Roguelite perdi anche i <b>Pixel Core non ancora riscossi</b>. I Core già salvati e i record precedenti restano intatti.</p>
<p style="text-align:left"><b>⚙ IMPOSTAZIONI DAL MENU</b><br>Puoi modificare <b>TOCCO LIBERO</b> anche dal menu principale tramite l’icona ⚙ in basso. Nel menu impostazioni trovi solo questa opzione e il comando per tornare indietro.</p>
<p style="text-align:left"><b>👆 TOCCO LIBERO (OPZIONALE)</b><br>Di default il cursore si ferma soltanto premendo <b>STOP</b> (o la barra spaziatrice). Apri <b>⚙ IMPOSTAZIONI</b> durante una partita per attivare <b>TOCCO LIBERO</b>: potrai fermarti toccando anche lo sfondo e l'arena. I pulsanti <b>IL MIO DECK</b> e <b>IMPOSTAZIONI</b>, come gli altri controlli e i menu, non attivano lo STOP. L'opzione è comune a entrambe le modalità e viene salvata nel browser.</p>
<p style="text-align:left"><b>🎯 OBIETTIVO E COMANDI</b><br>Il cursore giallo corre sul bordo della forma. Premi <b>STOP</b> (comando predefinito) oppure <b>SPAZIO</b> quando raggiunge la <b>zona verde</b>. Se sbagli perdi, salvo protezioni attive. La zona verde cambia posizione dopo ogni centro.</p>
<p style="text-align:left"><b>✨ PERFECT, COMBO E BOOST</b><br>La fascia luminosa al centro della zona verde è la <b>zona Perfect</b>: colpirla dà più punti e <b>1 carica boost</b>. A <b>3 cariche</b> parte automaticamente un potenziamento: <b>Slow-Mo</b> rallenta il cursore, <b>Wide</b> allarga la zona del prossimo colpo e <b>Shield</b> protegge da un errore. Le cariche extra rimangono disponibili. Le combo aumentano il moltiplicatore fino a ×5.</p>
<p style="text-align:left"><b>🔺 FORME E DIFFICOLTÀ</b><br>Ogni partita comincia con un <b>cerchio</b>. Ogni <b>5 centri</b> la forma cambia: prima quadrato, rettangolo, triangolo e rombo in ordine casuale senza ripetizioni, poi anche forme astratte. Il cursore accelera e la zona valida può restringersi.</p>

<p style="text-align:left"><b>⏸ CONTROLLA IL DECK DURANTE LA RUN</b><br>In Roguelite, mentre giochi, premi <b>▣ IL MIO DECK</b> in alto: il gioco va in pausa e puoi consultare tutte le 5 carte attualmente attive, con icona, rarità, descrizione e copie. Premi <b>RIPRENDI PARTITA</b> per continuare esattamente dal punto in cui eri rimasto. Il deck mostrato include gli scambi già effettuati.</p><p style="text-align:left"><b>🔄 SCAMBIO CARTE OGNI 5 CENTRI</b><br>Durante il Roguelite, ogni <b>5 centri riusciti</b> si apre una schermata con <b>3 nuove carte proposte in alto</b> e <b>le tue 5 carte in basso</b>. Seleziona una proposta, poi la carta equipaggiata da scartare: puoi leggere le descrizioni e <b>confrontare ciò che perdi e ciò che ottieni</b> prima di confermare. Puoi anche <b>saltare lo scambio</b>. Il deck resta sempre di cinque carte. Quando scarti una carta, il suo effetto termina, ma le cariche boost già ottenute restano.</p>
<p style="text-align:left"><b>★ RARITÀ E LEGGENDARIE</b><br>Le <b>comuni</b> vengono proposte più spesso, le <b>rare</b> meno e le <b>leggendarie</b> molto raramente. Le carte possono ripresentarsi; alcune permettono più copie, fino al proprio limite. Puoi avere <b>massimo una leggendaria</b> nel deck: una leggendaria equipaggiata può essere sostituita <b>solo da un'altra leggendaria</b>, mai da una comune o rara. Anche le leggendarie proposte possono sostituire soltanto lo slot leggendario.</p>
<p style="text-align:left"><b>⚡ SINERGIE DI ESEMPIO</b><br><b>Sweet Spot</b> (comune) aumenta la fascia Perfect del 5% per copia, fino a tre copie; <b>Perfect Focus</b> (rara) aggiunge il 20%, per un massimo combinato di +35%. Non allargano la zona verde. <b>Fast Charge</b> dà 2 cariche extra ogni 3 Perfect consecutivi; <b>Perfect Battery</b> dà 1 carica extra ogni 2 Perfect totali. Combinale per ottenere boost più spesso. <b>Circle Recall</b> forza il cerchio per i 5 centri successivi, una sola volta per run.</p>
<p style="text-align:left"><b>🌀 MUTAZIONI</b><br>Ogni <b>10 centri</b> nel Roguelite arriva una mutazione: può invertire il movimento, accelerare il cambio di forma o rendere più stretta la zona valida.</p>
<p style="text-align:left"><b>◆ OFFICINA E PIXEL CORE</b><br>Il Roguelite assegna Pixel Core alla fine della partita: <b>5 ogni 5 centri</b>, <b>3 ogni 10 Perfect</b>, più <b>10 Core ogni 25 centri</b> e <b>25 Core ogni 50 centri</b>. I premi per 25 e 50 centri sono cumulativi e si ripetono nelle run lunghe; i bonus delle carte si applicano sul totale. Nell'Officina acquisti le carte da usare nelle build: <b>comuni standard 100 Core per copia</b>, <b>4 comuni premium 150 Core per copia</b>, <b>rare 300 Core per copia</b>. Ogni carta indica <b>copie possedute / massimo</b>; acquistare una seconda copia non regala la terza. Le leggendarie richiedono prima <b>100 centri in una sola run Roguelite</b>; si rivelano a <b>500, 1.000, 2.000 e 3.500</b> centri cumulativi e costano <b>700, 800, 900 e 1.000 Core</b>.</p>

function continueAfterCards(){if(pendingMutation){pendingMutation=false;addMutation()}else hide()}function addMutation(){const available=mutations.filter(x=>!mut.includes(x.id));if(!available.length){hide();return}const x=available[rand(available.length)];mut.push(x.id);show('⚠ MUTAZIONE','<p class="mut">'+x.name+'</p><p>'+x.desc+'</p><small>Le mutazioni restano fino al game over.</small>',[{label:'▶ CONTINUA',action:hide}]);sfx('mutation')}function animateGameOverScore(total){
